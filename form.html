<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chill Guys - Login Firebase</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f2f2;
    }

    .container{
      width:350px;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:black;
      color:white;
      cursor:pointer;
      margin-top:10px;
      font-size:16px;
    }

    button:hover{
      opacity:0.8;
    }

    p{
      text-align:center;
      margin-top:10px;
    }

    a{
      color:blue;
      cursor:pointer;
    }

    .hidden{
      display:none;
    }

    #signupMessage,
    #loginMessage{
      font-size:14px;
      margin-top:10px;
      text-align:center;
      color:red;
    }

  </style>
</head>
<body>

  <div class="container">

    <!-- SIGN UP -->
    <div id="signupBox">

      <h2>Đăng ký</h2>

      <input type="email"
      id="signupEmail"
      placeholder="Nhập email">

      <input type="password"
      id="signupPassword"
      placeholder="Nhập mật khẩu">

      <button id="signupBtn">
        Đăng ký
      </button>

      <p>
        Đã có tài khoản?
        <a onclick="showLogin()">
          Đăng nhập
        </a>
      </p>

      <p id="signupMessage"></p>

    </div>

    <!-- LOGIN -->
    <div id="loginBox" class="hidden">

      <h2>Đăng nhập</h2>

      <input type="email"
      id="loginEmail"
      placeholder="Nhập email">

      <input type="password"
      id="loginPassword"
      placeholder="Nhập mật khẩu">

      <button id="loginBtn">
        Đăng nhập
      </button>

      <p>
        Chưa có tài khoản?
        <a onclick="showSignup()">
          Đăng ký
        </a>
      </p>

      <p id="loginMessage"></p>

    </div>

  </div>

  <!-- FIREBASE -->
  <script type="module">

    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // CẤU HÌNH FIREBASE
    // Thay bằng config của bạn
  const firebaseConfig = {
  apiKey: "AIzaSyA4kJDVG7XBWv3gFSdkCdQA_k9Df2qOj4k",
  authDomain: "quanganh-dc7c4.firebaseapp.com",
  projectId: "quanganh-dc7c4",
  storageBucket: "quanganh-dc7c4.firebasestorage.app",
  messagingSenderId: "45936787005",
  appId: "1:45936787005:web:dd351641ab446b83e63454",
  measurementId: "G-KJXXRCYCP8"
};

    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // hiện form login
    window.showLogin = function(){

      document
      .getElementById("signupBox")
      .classList.add("hidden");

      document
      .getElementById("loginBox")
      .classList.remove("hidden");

    }

    // hiện form signup
    window.showSignup = function(){

      document
      .getElementById("loginBox")
      .classList.add("hidden");

      document
      .getElementById("signupBox")
      .classList.remove("hidden");

    }

    // ĐĂNG KÝ
    document
    .getElementById("signupBtn")
    .addEventListener("click", () => {

      const email =
      document.getElementById("signupEmail").value;

      const password =
      document.getElementById("signupPassword").value;

      const message =
      document.getElementById("signupMessage");

      createUserWithEmailAndPassword(
        auth,
        email,
        password
      )

      .then((userCredential) => {

        message.style.color = "green";

        message.innerText =
        "Đăng ký thành công";

      })

      .catch((error) => {

        message.style.color = "red";

        message.innerText =
        "Tài khoản đã tồn tại hoặc mật khẩu quá yếu"

      });

    });

    // ĐĂNG NHẬP
    document
    .getElementById("loginBtn")
    .addEventListener("click", () => {

      const email =
      document.getElementById("loginEmail").value;

      const password =
      document.getElementById("loginPassword").value;

      const message =
      document.getElementById("loginMessage");

      signInWithEmailAndPassword(
        auth,
        email,
        password
      )

      .then((userCredential) => {

        message.style.color = "green";

        message.innerText =
        "Đăng nhập thành công";

        setTimeout(() => {

          window.location.href =
          "index.html";

        },1000);

      })

      .catch((error) => {

        message.style.color = "red";

        message.innerText =
        "Sai tài khoản hoặc mật khẩu";

      });

    });

  </script>

</body>
</html>
