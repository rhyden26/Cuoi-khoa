<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>

  <style>
    body{
      font-family: Arial;
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .login-box{
      background:white;
      padding:30px;
      width:300px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:10px;
      margin:10px 0;
    }

    button{
      width:100%;
      padding:10px;
      background:black;
      color:white;
      border:none;
      cursor:pointer;
    }

    button:hover{
      opacity:0.8;
    }

    #message{
      text-align:center;
      margin-top:10px;
      color:red;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Đăng nhập</h2>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Mật khẩu">

    <button id="loginBtn">Đăng nhập</button>

    <p id="message"></p>
  </div>

  <script src="log_in.js" type="module"></script>

</body>
</html>
