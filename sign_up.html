<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đăng ký</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Đăng ký</h1>
  <form id="signup">
    <label>Tên đầy đủ<input id="name-Sign"></label>
    <label>Email<input id="e-Sign" type="email"></label>
    <div id="textEmailSignUp" style="color:red"></div>
    <label>Mật khẩu<input id="pwd-Sign" type="password"></label>
    <label>Nhập lại mật khẩu<input id="cfPwd-Sign" type="password"></label>
    <div id="textPwdSignUp" style="color:red"></div>
    <button id="btn-SignUp">Đăng ký</button>
  </form>
  <script type="module" src="sign_up.js"></script>
</body>
</html>
