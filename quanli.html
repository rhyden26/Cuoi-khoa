<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lí Sản Phẩm Giày - Premium Dark Dashboard</title>

  <style>
    /* BẢNG MÀU DARK MODE CHUYÊN NGHIỆP */
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --success-hover: #16a34a;
      --warning: #eab308;
      --warning-hover: #ca8a04;
      --danger: #ef4444;
      --bg-main: #0f172a;       
      --bg-card: #1e293b;       
      --bg-input: #334155;      
      --text-main: #f8fafc;     
      --text-muted: #94a3b8;    
      --border-color: #334155;  
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      padding: 30px;
    }

    .container {
      max-width: 1500px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 30px;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 30px;
      align-items: start;
    }

    .sidebar-card {
      background: var(--bg-card);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 15px;
      background-color: var(--bg-input);
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .form-group input::placeholder {
      color: #64748b;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .upload-area {
      position: relative;
      border: 2px dashed #475569;
      background: #1e293b;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 125px;
    }

    .upload-area:hover {
      background: #334155;
      border-color: #64748b;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      font-size: 28px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .upload-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.4;
    }

    .preview-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .preview-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-delete-preview {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 5;
    }

    .action-group {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .add-btn { background: var(--primary); }
    .add-btn:hover:not(:disabled) { background: var(--primary-hover); }

    .update-btn { background: var(--success); }
    .update-btn:hover:not(:disabled) { background: var(--success-hover); }

    .restore-btn { background: var(--warning); color: #0f172a; }
    .restore-btn:hover:not(:disabled) { background: var(--warning-hover); }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .search-container input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.2);
    }

    .search-container input::placeholder {
      color: #64748b;
    }

    .search-container input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .stats-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.2);
    }

    .stat-card h3 {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card p {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
    }

    .table-container {
      background: var(--bg-card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table th {
      background: #1e293b;
      color: var(--text-muted);
      padding: 16px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    table td {
      padding: 16px;
      font-size: 15px;
      color: #e2e8f0;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    table tr:last-child td {
      border-bottom: none;
    }

    .product-img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    .available { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .low { background: rgba(234, 179, 8, 0.15); color: #facc15; }
    .out { background: rgba(239, 44, 44, 0.15); color: #f87171; }

    .row-actions {
      display: flex;
      gap: 6px;
    }

    .btn-table {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-table.edit { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .btn-table.edit:hover { background: rgba(59, 130, 246, 0.3); }
    .btn-table.delete { background: rgba(239, 44, 44, 0.15); color: #f87171; }
    .btn-table.delete:hover { background: rgba(239, 44, 44, 0.3); }

    @media(max-width: 1024px) {
      .dashboard-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Hệ Thống Quản Lí Sản Phẩm Giày</h1>

    <div class="dashboard-layout">
      
      <div class="sidebar-card">
        <div class="form-group">
          <label for="name">Tên sản phẩm</label>
          <input type="text" id="name" placeholder="Ví dụ: Nike Air Force 1">
        </div>
        
        <div class="form-group">
          <label for="price">Giá bán ($)</label>
          <input type="text" id="price" placeholder="Ví dụ: 120">
        </div>
        
        <div class="form-group">
          <label for="quantity">Số lượng kho</label>
          <input type="number" id="quantity" placeholder="Ví dụ: 50" min="0">
        </div>

        <div class="form-group">
          <label>Hình ảnh sản phẩm</label>
          <div class="upload-area">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Kéo thả ảnh tại đây<br><span style="font-size:11px; color:var(--text-muted);">hoặc click để chọn file</span></div>
            <input type="file" id="imageFile" accept="image/*">
            
            <div class="preview-overlay" id="previewBox">
              <button type="button" class="btn-delete-preview" id="btnRemovePreview">×</button>
              <img src="" id="imgPreview">
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="status">Trạng thái hàng hóa</label>
          <select id="status">
            <option value="Còn hàng">Còn hàng</option>
            <option value="Sắp hết">Sắp hết</option>
            <option value="Hết hàng">Hết hàng</option>
          </select>
        </div>

        <div class="action-group">
          <button class="btn-main add-btn" id="btnAdd">✨ Thêm Sản Phẩm</button>
          <button class="btn-main update-btn" id="btnUpdate">💾 Lưu Chỉnh Sửa</button>
          <button class="btn-main restore-btn" id="btnRestore">🔄 Khôi Phục Sản Phẩm</button>
        </div>
      </div>

      <div class="main-content">
        
        <div class="search-container">
          <input type="text" id="search" placeholder="🔍 Tìm kiếm sản phẩm nhanh theo tên...">
        </div>

        <div class="stats-cards">
          <div class="stat-card">
            <h3>Tổng Sản Phẩm</h3>
            <p id="totalProducts">0</p>
          </div>
          <div class="stat-card" style="border-left: 4px solid var(--success);">
            <h3>Đang Còn Hàng</h3>
            <p id="availableProducts">0</p>
          </div>
          <div class="stat-card" style="border-left: 4px solid var(--danger);">
            <h3>Đã Hết Hàng</h3>
            <p id="outProducts">0</p>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 90px;">Hình Ảnh</th>
                <th>Tên Giày</th>
                <th>Giá Bán</th>
                <th>Số Lượng</th>
                <th>Trạng Thái</th>
                <th style="width: 140px; text-align: center;">Hành Động</th>
              </tr>
            </thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>

      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4kJDVG7XBWv3gFSdkCdQA_k9Df2qOj4k",
      authDomain: "quanganh-dc7c4.firebaseapp.com",
      databaseURL: "https://quanganh-dc7c4-default-rtdb.firebaseio.com",
      projectId: "quanganh-dc7c4",
      storageBucket: "quanganh-dc7c4.firebasestorage.app",
      messagingSenderId: "45936787005",
      appId: "1:45936787005:web:dd351641ab446b83e63454"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let productsList = {}; 
    let deletedProducts = []; 
    let editId = null;
    let base64ImageString = ""; 

    const fileInput = document.getElementById("imageFile");
    const previewBox = document.getElementById("previewBox");
    const imgPreview = document.getElementById("imgPreview");
    const btnRemovePreview = document.getElementById("btnRemovePreview");
    const qtyInput = document.getElementById("quantity");
    const statusSelect = document.getElementById("status");

    // LOGIC MỚI: Tự động đổi trạng thái Select Box khi Admin nhập số lượng
    qtyInput.addEventListener("input", function() {
      const qty = Number(this.value);
      if (qty <= 0) {
        statusSelect.value = "Hết hàng";
      } else if (qty > 0 && qty <= 5) {
        statusSelect.value = "Sắp hết";
      } else {
        statusSelect.value = "Còn hàng";
      }
    });

    fileInput.addEventListener("change", function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64ImageString = e.target.result;
          imgPreview.src = base64ImageString;
          previewBox.style.display = "flex";
        }
        reader.readAsDataURL(file);
      }
    });

    btnRemovePreview.addEventListener("click", function(e) {
      e.stopPropagation();
      fileInput.value = ""; 
      previewBox.style.display = "none"; 
      imgPreview.src = "";
      base64ImageString = "";
    });

    const productsRef = ref(db, "products");
    onValue(productsRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        productsList = data;
        renderProducts(data);
      } else {
        productsList = {};
        document.getElementById("productTable").innerHTML = "";
        document.getElementById("totalProducts").innerText = "0";
        document.getElementById("availableProducts").innerText = "0";
        document.getElementById("outProducts").innerText = "0";
      }
    });

    function renderProducts(productsObj) {
      const table = document.getElementById("productTable");
      table.innerHTML = "";
      let total = 0, available = 0, out = 0;

      Object.keys(productsObj).forEach(id => {
        const product = productsObj[id];
        total++;
        
        // KIỂM TRA ĐỒNG BỘ: Nếu DB có lỗi số lượng = 0 nhưng status vẫn là "Còn hàng" thì sẽ tự ép hiển thị chuẩn
        let currentStatus = product.status;
        if (Number(product.quantity) <= 0) {
          currentStatus = "Hết hàng";
        }

        let statusClass = "available";
        if (currentStatus === "Sắp hết") statusClass = "low";
        if (currentStatus === "Hết hàng") statusClass = "out";

        if (currentStatus !== "Hết hàng") available++; else out++;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><img src="${product.image}" class="product-img" onerror="this.src='https://placehold.co/80'"></td>
          <td style="font-weight: 600; color: var(--text-main);">${product.name}</td>
          <td style="font-weight: 600; color: var(--primary);">$${product.price}</td>
          <td><span style="background: #334155; padding: 4px 8px; border-radius: 6px; font-weight: 500; color:#f1f5f9;">${product.quantity} đôi</span></td>
          <td><span class="status-badge ${statusClass}">${currentStatus}</span></td>
          <td>
            <div class="row-actions">
              <button class="btn-table edit">Sửa</button>
              <button class="btn-table delete">Xóa</button>
            </div>
          </td>
        `;
        tr.querySelector(".edit").addEventListener("click", () => editProduct(id, product));
        tr.querySelector(".delete").addEventListener("click", () => deleteProduct(id, product));
        table.appendChild(tr);
      });

      document.getElementById("totalProducts").innerText = total;
      document.getElementById("availableProducts").innerText = available;
      document.getElementById("outProducts").innerText = out;
    }

    function addProduct() {
      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value.trim();
      let quantity = Number(document.getElementById("quantity").value);
      let status = document.getElementById("status").value;
      const btnAdd = document.getElementById("btnAdd");

      if (!name || !price || document.getElementById("quantity").value === "") {
        alert("Vui lòng điền đầy đủ các thông tin bắt buộc!");
        return;
      }

      if (!base64ImageString) {
        alert("Vui lòng tải ảnh minh họa của giày lên!");
        return;
      }

      // Ràng buộc điều kiện hết hàng
      if (quantity <= 0) {
        quantity = 0;
        status = "Hết hàng";
      }

      btnAdd.innerText = "⏳ Đang xử lý...";
      btnAdd.disabled = true;

      const productData = {
        name,
        price: price,
        quantity: quantity,
        image: base64ImageString, 
        status: status
      };

      set(push(ref(db, "products")), productData)
        .then(() => {
          alert("Thêm sản phẩm mới thành công!");
          clearForm();
        })
        .catch((error) => {
          alert("Lỗi: " + error.message);
        })
        .finally(() => {
          btnAdd.innerText = "✨ Thêm Sản Phẩm";
          btnAdd.disabled = false;
        });
    }

    function deleteProduct(id, productData) {
      if (confirm(`Bạn chắc chắn muốn xóa sản phẩm "${productData.name}"?`)) {
        deletedProducts.push({ id, ...productData });
        remove(ref(db, `products/${id}`));
      }
    }

    function restoreProducts() {
      if (deletedProducts.length === 0) {
        alert("Không có sản phẩm nào để khôi phục!");
        return;
      }
      const restoreItem = deletedProducts.pop();
      set(ref(db, `products/${restoreItem.id}`), {
        name: restoreItem.name,
        price: restoreItem.price,
        quantity: restoreItem.quantity,
        image: restoreItem.image,
        status: restoreItem.status
      }).then(() => {
        alert("Khôi phục sản phẩm cũ thành công!");
      });
    }

    function editProduct(id, product) {
      editId = id;
      base64ImageString = product.image;

      document.getElementById("name").value = product.name;
      document.getElementById("price").value = product.price;
      document.getElementById("quantity").value = product.quantity;
      document.getElementById("status").value = product.status;

      imgPreview.src = product.image;
      previewBox.style.display = "flex";
      fileInput.value = ""; 

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateProduct() {
      if (editId === null) {
        alert("Vui lòng chọn một sản phẩm bên dưới để tiến hành chỉnh sửa!");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value.trim();
      let quantity = Number(document.getElementById("quantity").value);
      let status = document.getElementById("status").value;
      const btnUpdate = document.getElementById("btnUpdate");

      if (!name || !price || document.getElementById("quantity").value === "") {
        alert("Vui lòng không để trống thông tin sản phẩm!");
        return;
      }

      // Kiểm tra ép buộc trạng thái "Hết hàng" nếu số lượng bằng hoặc nhỏ hơn 0
      if (quantity <= 0) {
        quantity = 0;
        status = "Hết hàng";
      }

      btnUpdate.innerText = "⏳ Đang cập nhật...";
      btnUpdate.disabled = true;

      set(ref(db, `products/${editId}`), {
        name: name,
        price: price,
        quantity: quantity,
        image: base64ImageString,
        status: status
      }).then(() => {
        clearForm();
        editId = null;
        alert("Cập nhật thông tin thành công!");
      }).catch(err => alert("Lỗi: " + err.message))
      .finally(() => {
        btnUpdate.innerText = "💾 Lưu Chỉnh Sửa";
        btnUpdate.disabled = false;
      });
    }

    function searchProduct() {
      const value = document.getElementById("search").value.toLowerCase();
      const rows = document.querySelectorAll("#productTable tr");
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(value) ? "" : "none";
      });
    }

    function clearForm() {
      document.getElementById("name").value = "";
      document.getElementById("price").value = "";
      document.getElementById("quantity").value = "";
      fileInput.value = "";
      previewBox.style.display = "none";
      imgPreview.src = "";
      base64ImageString = "";
      document.getElementById("status").value = "Còn hàng";
    }

    document.getElementById("btnAdd").addEventListener("click", addProduct);
    document.getElementById("btnUpdate").addEventListener("click", updateProduct);
    document.getElementById("btnRestore").addEventListener("click", restoreProducts);
    document.getElementById("search").addEventListener("keyup", searchProduct);
  </script>

</body>
</html>
