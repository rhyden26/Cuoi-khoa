<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lí Sản Phẩm Giày - Premium Dark Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* BẢNG MÀU DARK MODE GLASSMORPHISM & NEON GLOW */
    :root {
      --primary: #3b82f6;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(59, 130, 246, 0.22);
      --success: #10b981;
      --success-hover: #059669;
      --success-glow: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --warning-glow: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-glow: rgba(239, 68, 68, 0.15);
      
      --bg-main: #0b0f19;      
      --bg-card: #151f32;      
      --bg-input: #1e293b;      
      --text-main: #f8fafc;     
      --text-muted: #64748b;    
      --text-desc: #94a3b8;
      --border-color: #243249;  
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
    }

    .container {
      max-width: 1600px;
      margin: auto;
    }

    /* HEADER BANNER */
    .header-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 35px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 i {
      color: var(--primary);
      -webkit-text-fill-color: initial;
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
      align-items: start;
    }

    /* CARD STYLE CHUNG */
    .card-custom {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 10px 30px -10px rgb(0 0 0 / 0.7);
      border: 1px solid var(--border-color);
      transition: border-color 0.3s ease;
    }
    
    .card-custom:hover {
      border-color: #2e3f5d;
    }

    .sidebar-card {
      padding: 28px;
      position: sticky;
      top: 30px;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* INPUTS & FORMS */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-desc);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      background-color: var(--bg-input);
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-group input::placeholder {
      color: #475569;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
      background-color: #223047;
    }

    /* UPLOAD AREA */
    .upload-area {
      position: relative;
      border: 2px dashed #334155;
      background: #1a2436;
      border-radius: 10px;
      padding: 25px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 135px;
    }

    .upload-area:hover {
      background: var(--bg-input);
      border-color: var(--primary);
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .upload-text {
      font-size: 13px;
      color: var(--text-desc);
      font-weight: 500;
      line-height: 1.5;
    }

    /* PREVIEW OVERLAY */
    .preview-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .preview-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-delete-preview {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 5;
    }
    
    .btn-delete-preview:hover {
      background: var(--danger-hover);
    }

    /* ACTION BUTTONS */
    .action-group {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-main {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-main:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .add-btn { background: var(--primary); box-shadow: 0 4px 12px var(--primary-glow); }
    .add-btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }

    .update-btn { background: var(--success); box-shadow: 0 4px 12px var(--success-glow); }
    .update-btn:hover:not(:disabled) { background: var(--success-hover); transform: translateY(-1px); }

    .restore-btn { background: #1e293b; color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .restore-btn:hover:not(:disabled) { background: #243249; color: #fbbf24; }

    /* MAIN CONTENT */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* SEARCH BAR */
    .search-container {
      position: relative;
    }

    .search-container i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-desc);
      font-size: 16px;
    }

    .search-container input {
      width: 100%;
      padding: 15px 16px 15px 48px;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      font-size: 14px;
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 4px 20px -5px rgb(0 0 0 / 0.5);
      transition: all 0.2s ease;
    }

    .search-container input:focus {
      outline: none;
      border-color: var(--primary);
      background: #152238;
    }

    /* STATS CARDS */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .stat-card {
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-info h3 {
      font-size: 13px;
      color: var(--text-desc);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .stat-info p {
      font-size: 30px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .icon-total { background: rgba(241, 245, 249, 0.05); color: #94a3b8; }
    .icon-avail { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .icon-out { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    /* DATA TABLE */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table th {
      background: #1a263d;
      color: var(--text-desc);
      padding: 16px 20px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
    }

    table td {
      padding: 16px 20px;
      font-size: 14px;
      color: #cbd5e1;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    table tr {
      transition: background 0.2s ease;
    }

    table tr:hover td {
      background: rgba(255, 255, 255, 0.015);
      color: #fff;
    }

    table tr:last-child td {
      border-bottom: none;
    }

    .product-img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #2e3f5d;
      box-shadow: 0 4px 10px rgb(0 0 0 / 0.3);
    }

    /* BADGES */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .status-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .available { background: rgba(16, 185, 129, 0.12); color: #34d399; }
    .available::before { background: #34d399; }

    .low { background: rgba(245, 158, 11, 0.12); color: #fbbf24; }
    .low::before { background: #fbbf24; }

    .out { background: rgba(239, 68, 68, 0.12); color: #f87171; }
    .out::before { background: #f87171; }

    /* TABLE ACTIONS */
    .row-actions {
      display: flex;
      gap: 8px;
    }

    .btn-table {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-table.edit { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
    .btn-table.edit:hover { background: var(--primary); color: white; transform: scale(1.05); }
    
    .btn-table.delete { background: rgba(239, 68, 68, 0.1); color: #f87171; }
    .btn-table.delete:hover { background: var(--danger); color: white; transform: scale(1.05); }

    /* RESPONSIVE */
    @media(max-width: 1150px) {
      .dashboard-layout {
        grid-template-columns: 1fr;
      }
      .sidebar-card {
        position: static;
      }
    }
    
    @media(max-width: 650px) {
      .stats-cards {
        grid-template-columns: 1fr;
      }
      body {
        padding: 20px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header-panel">
      <h1><i class="fa-solid to-blue-500 fa-boxes-stacked"></i> Hệ Thống Quản Lí Sản Phẩm Giày</h1>
    </div>

    <div class="dashboard-layout">
      
      <div class="card-custom sidebar-card">
        <div class="sidebar-title">
          <i class="fa-solid fa-square-plus" style="color: var(--primary);"></i>
          <span>Thông tin sản phẩm</span>
        </div>

        <div class="form-group">
          <label for="name">Tên sản phẩm</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-tag"></i>
            <input type="text" id="name" placeholder="Sản phẩm">
          </div>
        </div>
        
        <div class="form-group">
          <label for="price">Giá bán ($)</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-dollar-sign"></i>
            <input type="text" id="price" placeholder="0.00">
          </div>
        </div>
        
        <div class="form-group">
          <label for="quantity">Số lượng kho</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-layer-group"></i>
            <input type="number" id="quantity" placeholder="0" min="0">
          </div>
        </div>

        <div class="form-group">
          <label>Hình ảnh sản phẩm</label>
          <div class="upload-area">
            <div class="upload-icon"><i class="fa-regular fa-image"></i></div>
            <div class="upload-text">Kéo thả ảnh tại đây<br><span style="font-size:11px; color:var(--text-muted);">hoặc click để chọn file</span></div>
            <input type="file" id="imageFile" accept="image/*">
            
            <div class="preview-overlay" id="previewBox">
              <button type="button" class="btn-delete-preview" id="btnRemovePreview"><i class="fa-solid fa-xmark"></i></button>
              <img src="" id="imgPreview">
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="status">Trạng thái hàng hóa</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-circle-info"></i>
            <select id="status">
              <option value="Còn hàng">Còn hàng</option>
              <option value="Sắp hết">Sắp hết</option>
              <option value="Hết hàng">Hết hàng</option>
            </select>
          </div>
        </div>

        <div class="action-group">
          <button class="btn-main add-btn" id="btnAdd"><i class="fa-solid fa-wand-magic-sparkles"></i> Thêm Sản Phẩm</button>
          <button class="btn-main update-btn" id="btnUpdate"><i class="fa-solid fa-floppy-disk"></i> Lưu Chỉnh Sửa</button>
          <button class="btn-main restore-btn" id="btnRestore"><i class="fa-solid fa-rotate-left"></i> Khôi Phục Sản Phẩm</button>
        </div>
      </div>

      <div class="main-content">
        
        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search" placeholder="Tìm kiếm nhanh theo tên sản phẩm giày...">
        </div>

        <div class="stats-cards">
          <div class="card-custom stat-card">
            <div class="stat-info">
              <h3>Tổng Sản Phẩm</h3>
              <p id="totalProducts">0</p>
            </div>
            <div class="stat-icon icon-total"><i class="fa-solid fa-cubes"></i></div>
          </div>
          <div class="card-custom stat-card" style="border-left: 3px solid var(--success);">
            <div class="stat-info">
              <h3>Đang Còn Hàng</h3>
              <p id="availableProducts">0</p>
            </div>
            <div class="stat-icon icon-avail"><i class="fa-solid fa-circle-check"></i></div>
          </div>
          <div class="card-custom stat-card" style="border-left: 3px solid var(--danger);">
            <div class="stat-info">
              <h3>Đã Hết Hàng</h3>
              <p id="outProducts">0</p>
            </div>
            <div class="stat-icon icon-out"><i class="fa-solid fa-circle-exclamation"></i></div>
          </div>
        </div>

        <div class="card-custom table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 100px;">Hình Ảnh</th>
                <th>Tên Giày</th>
                <th>Giá Bán</th>
                <th>Số Lượng</th>
                <th>Trạng Thái</th>
                <th style="width: 120px; text-align: center;">Hành Động</th>
              </tr>
            </thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>

      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4kJDVG7XBWv3gFSdkCdQA_k9Df2qOj4k",
      authDomain: "quanganh-dc7c4.firebaseapp.com",
      databaseURL: "https://quanganh-dc7c4-default-rtdb.firebaseio.com",
      projectId: "quanganh-dc7c4",
      storageBucket: "quanganh-dc7c4.firebasestorage.app",
      messagingSenderId: "45936787005",
      appId: "1:45936787005:web:dd351641ab446b83e63454"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let productsList = {}; 
    let deletedProducts = []; 
    let editId = null;
    let base64ImageString = ""; 

    const fileInput = document.getElementById("imageFile");
    const previewBox = document.getElementById("previewBox");
    const imgPreview = document.getElementById("imgPreview");
    const btnRemovePreview = document.getElementById("btnRemovePreview");
    const qtyInput = document.getElementById("quantity");
    const statusSelect = document.getElementById("status");

    qtyInput.addEventListener("input", function() {
      const qty = Number(this.value);
      if (qty <= 0) {
        statusSelect.value = "Hết hàng";
      } else if (qty > 0 && qty <= 5) {
        statusSelect.value = "Sắp hết";
      } else {
        statusSelect.value = "Còn hàng";
      }
    });

    fileInput.addEventListener("change", function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64ImageString = e.target.result;
          imgPreview.src = base64ImageString;
          previewBox.style.display = "flex";
        }
        reader.readAsDataURL(file);
      }
    });

    btnRemovePreview.addEventListener("click", function(e) {
      e.stopPropagation();
      fileInput.value = ""; 
      previewBox.style.display = "none"; 
      imgPreview.src = "";
      base64ImageString = "";
    });

    const productsRef = ref(db, "products");
    onValue(productsRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        productsList = data;
        renderProducts(data);
      } else {
        productsList = {};
        document.getElementById("productTable").innerHTML = "";
        document.getElementById("totalProducts").innerText = "0";
        document.getElementById("availableProducts").innerText = "0";
        document.getElementById("outProducts").innerText = "0";
      }
    });

    function renderProducts(productsObj) {
      const table = document.getElementById("productTable");
      table.innerHTML = "";
      let total = 0, available = 0, out = 0;

      Object.keys(productsObj).forEach(id => {
        const product = productsObj[id];
        total++;
        
        let currentStatus = product.status;
        if (Number(product.quantity) <= 0) {
          currentStatus = "Hết hàng";
        }

        let statusClass = "available";
        if (currentStatus === "Sắp hết") statusClass = "low";
        if (currentStatus === "Hết hàng") statusClass = "out";

        if (currentStatus !== "Hết hàng") available++; else out++;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><img src="${product.image}" class="product-img" onerror="this.src='https://placehold.co/80'"></td>
          <td style="font-weight: 600; color: #fff;">${product.name}</td>
          <td style="font-weight: 600; color: var(--primary); font-size: 15px;">$${product.price}</td>
          <td><span style="background: #1e293b; padding: 5px 10px; border-radius: 6px; font-weight: 500; font-size: 13px; border: 1px solid var(--border-color);">${product.quantity} đôi</span></td>
          <td><span class="status-badge ${statusClass}">${currentStatus}</span></td>
          <td>
            <div class="row-actions">
              <button class="btn-table edit" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button>
              <button class="btn-table delete" title="Xóa"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </td>
        `;
        tr.querySelector(".edit").addEventListener("click", () => editProduct(id, product));
        tr.querySelector(".delete").addEventListener("click", () => deleteProduct(id, product));
        table.appendChild(tr);
      });

      document.getElementById("totalProducts").innerText = total;
      document.getElementById("availableProducts").innerText = available;
      document.getElementById("outProducts").innerText = out;
    }

    function addProduct() {
      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value.trim();
      let quantity = Number(document.getElementById("quantity").value);
      let status = document.getElementById("status").value;
      const btnAdd = document.getElementById("btnAdd");

      if (!name || !price || document.getElementById("quantity").value === "") {
        alert("Vui lòng điền đầy đủ các thông tin bắt buộc!");
        return;
      }

      if (!base64ImageString) {
        alert("Vui lòng tải ảnh minh họa của giày lên!");
        return;
      }

      if (quantity <= 0) {
        quantity = 0;
        status = "Hết hàng";
      }

      btnAdd.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
      btnAdd.disabled = true;

      const productData = {
        name,
        price: price,
        quantity: quantity,
        image: base64ImageString, 
        status: status
      };

      set(push(ref(db, "products")), productData)
        .then(() => {
          alert("Thêm sản phẩm mới thành công!");
          clearForm();
        })
        .catch((error) => {
          alert("Lỗi: " + error.message);
        })
        .finally(() => {
          btnAdd.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Thêm Sản Phẩm';
          btnAdd.disabled = false;
        });
    }

    function deleteProduct(id, productData) {
      if (confirm(`Bạn chắc chắn muốn xóa sản phẩm "${productData.name}"?`)) {
        deletedProducts.push({ id, ...productData });
        remove(ref(db, `products/${id}`));
      }
    }

    function restoreProducts() {
      if (deletedProducts.length === 0) {
        alert("Không có sản phẩm nào để khôi phục!");
        return;
      }
      const restoreItem = deletedProducts.pop();
      set(ref(db, `products/${restoreItem.id}`), {
        name: restoreItem.name,
        price: restoreItem.price,
        quantity: restoreItem.quantity,
        image: restoreItem.image,
        status: restoreItem.status
      }).then(() => {
        alert("Khôi phục sản phẩm cũ thành công!");
      });
    }

    function editProduct(id, product) {
      editId = id;
      base64ImageString = product.image;

      document.getElementById("name").value = product.name;
      document.getElementById("price").value = product.price;
      document.getElementById("quantity").value = product.quantity;
      document.getElementById("status").value = product.status;

      imgPreview.src = product.image;
      previewBox.style.display = "flex";
      fileInput.value = ""; 

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateProduct() {
      if (editId === null) {
        alert("Vui lòng chọn một sản phẩm bên dưới để tiến hành chỉnh sửa!");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value.trim();
      let quantity = Number(document.getElementById("quantity").value);
      let status = document.getElementById("status").value;
      const btnUpdate = document.getElementById("btnUpdate");

      if (!name || !price || document.getElementById("quantity").value === "") {
        alert("Vui lòng không để trống thông tin sản phẩm!");
        return;
      }

      if (quantity <= 0) {
        quantity = 0;
        status = "Hết hàng";
      }

      btnUpdate.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang cập nhật...';
      btnUpdate.disabled = true;

      set(ref(db, `products/${editId}`), {
        name: name,
        price: price,
        quantity: quantity,
        image: base64ImageString,
        status: status
      }).then(() => {
        clearForm();
        editId = null;
        alert("Cập nhật thông tin thành công!");
      }).catch(err => alert("Lỗi: " + err.message))
      .finally(() => {
        btnUpdate.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Lưu Chỉnh Sửa';
        btnUpdate.disabled = false;
      });
    }

    function searchProduct() {
      const value = document.getElementById("search").value.toLowerCase();
      const rows = document.querySelectorAll("#productTable tr");
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(value) ? "" : "none";
      });
    }

    function clearForm() {
      document.getElementById("name").value = "";
      document.getElementById("price").value = "";
      document.getElementById("quantity").value = "";
      fileInput.value = "";
      previewBox.style.display = "none";
      imgPreview.src = "";
      base64ImageString = "";
      document.getElementById("status").value = "Còn hàng";
    }

    document.getElementById("btnAdd").addEventListener("click", addProduct);
    document.getElementById("btnUpdate").addEventListener("click", updateProduct);
    document.getElementById("btnRestore").addEventListener("click", restoreProducts);
    document.getElementById("search").addEventListener("keyup", searchProduct);
  </script>

</body>
</html>
