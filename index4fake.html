<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chill Guys - Nike Store</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
}

/* HEADER */

header{
  background:black;
  color:white;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:35px;
}

nav{
  display:flex;
  gap:20px;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* HERO */

.hero{
  height:450px;
  background:url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1600&auto=format&fit=crop') center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  position:relative;
}

.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero h2{
  font-size:60px;
}

.hero p{
  font-size:24px;
  margin-top:15px;
}

/* PRODUCTS */

section{
  padding:60px 40px;
}

.title{
  text-align:center;
  margin-bottom:40px;
  font-size:40px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card-content{
  padding:20px;
  text-align:center;
}

.card-content h3{
  font-size:25px;
  margin-bottom:10px;
}

.price{
  font-size:28px;
  font-weight:bold;
  margin:20px 0;
}

.btn{
  padding:12px 30px;
  border:none;
  border-radius:12px;
  background:black;
  color:white;
  font-size:17px;
  cursor:pointer;
}

.btn:hover{
  opacity:0.8;
}

/* CART */

.cart-box{
  margin-top:50px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.cart-box h2{
  text-align:center;
  margin-bottom:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.quantity-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.quantity-btn{
  width:35px;
  height:35px;
  border:none;
  border-radius:8px;
  background:black;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.cart-total{
  text-align:center;
  margin-top:20px;
  font-size:30px;
  font-weight:bold;
}

.checkout-btn{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:green;
  color:white;
  font-size:20px;
  cursor:pointer;
}

/* PAYMENT */

.payment-screen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.payment-box{
  width:95%;
  max-width:1200px;
  background:white;
  padding:30px;
  border-radius:20px;
}

.payment-box h2{
  text-align:center;
  margin-bottom:25px;
}

.payment-box input,
.payment-box select{
  width:100%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.payment-box input{
  margin-bottom:15px;
}

.address-row{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.address-row select{
  flex:1;
}

.confirm-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:black;
  color:white;
  font-size:18px;
  cursor:pointer;
  margin-top:10px;
}

.close-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:red;
  color:white;
  font-size:18px;
  cursor:pointer;
  margin-top:10px;
}

/* FOOTER */

footer{
  background:black;
  color:#aaa;
  text-align:center;
  padding:25px;
  margin-top:50px;
}

</style>
</head>

<script>

const products = [

{

},

{

},

{

},

{

price:190,
image:"https://images.unsplash.com/photo-1460353581641-37baddab0fa2?q=80&w=1200&auto=format&fit=crop"
},

{
name:"Nike InfinityRN",
price:210,
image:"https://images.unsplash.com/photo-1603787081207-362bcef7c144?q=80&w=1200&auto=format&fit=crop"
},

{
name:"Nike Free Run",
price:145,
image:"https://images.unsplash.com/photo-1605408499391-6368c628ef42?q=80&w=1200&auto=format&fit=crop"
},

{
name:"Nike Zoom Freak",
price:215,
image:"https://images.unsplash.com/photo-1575537302964-96cd47c06b1b?q=80&w=1200&auto=format&fit=crop"
},

{
name:"Nike Kyrie Low",
price:205,
image:"https://images.unsplash.com/photo-1600181516264-3ea807ff44b9?q=80&w=1200&auto=format&fit=crop"
},

{
name:"Nike KD Trey 5",
price:225,
image:"https://images.unsplash.com/photo-1605348532760-6753d2c43329?q=80&w=1200&auto=format&fit=crop"
},

{
name:"Nike Precision 6",
price:165,
image:"https://images.unsplash.com/photo-1560769629-975ec94e6a86?q=80&w=1200&auto=format&fit=crop"
}

];

const productContainer =
document.getElementById("products");

let cart = [];

products.forEach(product => {

productContainer.innerHTML += `

<div class="card">

<img src="${product.image}">

<div class="card-content">

<h3>${product.name}</h3>

<div class="price">
$${product.price}
</div>

<button class="btn"
onclick="addToCart('${product.name}',${product.price})">

Thêm Vào Giỏ

</button>

</div>

</div>

`;

});

function addToCart(name,price){

let found =
cart.find(item => item.name === name);

if(found){

found.quantity++;

}else{

cart.push({
name:name,
price:price,
quantity:1
});

}

renderCart();

}

function renderCart(){

const cartItems =
document.getElementById("cartItems");

cartItems.innerHTML = "";

let total = 0;

cart.forEach((item,index)=>{

total += item.price * item.quantity;

cartItems.innerHTML += `

<div class="cart-item">

<div>

<strong>${item.name}</strong>

<br>

$${item.price} x ${item.quantity}

</div>

<div class="quantity-box">

<button class="quantity-btn"
onclick="decreaseQuantity(${index})">

-

</button>

<span>${item.quantity}</span>

<button class="quantity-btn"
onclick="increaseQuantity(${index})">

+

</button>

</div>

</div>

`;

});

document.getElementById("cartTotal")
.innerText = "$" + total;

}

function increaseQuantity(index){

cart[index].quantity++;

renderCart();

}

function decreaseQuantity(index){

if(cart[index].quantity > 1){

cart[index].quantity--;

}else{

cart.splice(index,1);

}

renderCart();

}

function openPayment(){

if(cart.length === 0){

alert("Giỏ hàng đang trống!");
return;

}

document.getElementById("paymentScreen")
.style.display = "flex";

}

function closePayment(){

document.getElementById("paymentScreen")
.style.display = "none";

}

function confirmOrder(){

const name =
document.getElementById("customerName").value;

const street =
document.getElementById("street").value;

const district =
document.getElementById("district").value;

const province =
document.getElementById("province").value;

const date =
document.getElementById("deliveryDate").value;

if(
name === "" ||
street === "" ||
district === "" ||
province === "" ||
date === ""
){

alert("Vui lòng nhập đầy đủ thông tin!");
return;

}

alert(
"✅ Đặt hàng thành công!\n\n" +
"👤 Tên: " + name + "\n" +
"📍 Địa chỉ: " +
street + ", " +
district + ", " +
province + "\n" +
"📅 Ngày giao: " + date
);

cart = [];

renderCart();

closePayment();

}

</script>
